services:
  db:
    image: postgres:16-alpine
    container_name: khelkhud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: khelkhud
    ports:
      # Host port 5433: a locally installed Postgres already owns 5432 on this machine
      - "5433:5432"
    volumes:
      - khelkhud_pgdata:/var/lib/postgresql/data

volumes:
  khelkhud_pgdata:
