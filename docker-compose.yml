services:
  db:
    image: postgres:16-alpine
    container_name: khelkhud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: khelkhud
    ports:
      - "5432:5432"
    volumes:
      - khelkhud_pgdata:/var/lib/postgresql/data

volumes:
  khelkhud_pgdata:
