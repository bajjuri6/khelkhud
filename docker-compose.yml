services:
  db:
    image: postgres:16-alpine
    container_name: khelkhud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: khelkhud
    ports:
      # Host port 5434.
      #   5432 — a locally installed Postgres already owns it.
      #   5433 — the Kautilya bastion SSH tunnel (`ssh -L 5433:...`) binds it on
      #          127.0.0.1 whenever that tunnel is open. Docker publishes on 0.0.0.0, but
      #          a loopback-specific bind WINS for connections to localhost, so
      #          `localhost:5433` silently reaches the remote database instead of this
      #          container. That failed closed here (wrong credentials) but the failure
      #          mode is running migrations against the wrong server, so: 5434.
      - "5434:5432"
    volumes:
      - khelkhud_pgdata:/var/lib/postgresql/data

volumes:
  khelkhud_pgdata:
